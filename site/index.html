<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL DEAL HUNTER · 全球羊毛情报中心</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d36; --text:#e6edf3;
    --dim:#8b949e; --accent:#3fb950; --warn:#d29922; --bad:#f85149; --link:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
  header{padding:20px 24px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:19px;letter-spacing:.3px}
  h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
  .meta{color:var(--dim);font-size:12px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line)}
  .stat b{display:block;font-size:19px;color:var(--accent)}
  .stat span{color:var(--dim);font-size:11.5px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5}
  nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);
    padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12.5px}
  nav button.on{background:#1f6feb33;border-color:#1f6feb;color:#79c0ff}
  nav .sp{flex:1}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:6px 12px;font-size:12.5px;width:220px;outline:none}
  main{padding:16px 24px 60px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11.5px;
    padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #1c2229;vertical-align:top}
  tr:hover td{background:#12181f}
  .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
    border:1px solid var(--line);white-space:nowrap}
  .t-free{color:#3fb950;border-color:#238636;background:#12261a}
  .t-trial{color:#58a6ff;border-color:#1f6feb;background:#0d1b2e}
  .t-topup,.t-deposit{color:#d29922;border-color:#9e6a03;background:#2a1f0a}
  .t-spend{color:#db9a3d;border-color:#8a5a12;background:#241a08}
  .t-volume,.t-invite{color:#f85149;border-color:#8b2c28;background:#2a1210}
  .t-discount{color:#bc8cff;border-color:#6e40c9;background:#1e1330}
  .t-unknown{color:#8b949e}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  .title{max-width:520px}
  .src{color:var(--dim);font-size:11.5px}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dl{font-variant-numeric:tabular-nums;white-space:nowrap}
  .dl.soon{color:var(--warn)}
  .score{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
  .risk{color:var(--dim);font-size:11.5px;max-width:200px}
  .verified{color:var(--accent);font-size:11px}
  .unverified{color:var(--warn);font-size:11px}
  .blk{color:#8b949e;font-size:11px}
  .req{color:#d29922;font-size:11px;margin-top:2px}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  footer{padding:20px 24px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line)}
  @media(max-width:820px){ .hide-sm{display:none} .title{max-width:none} }
</style>
</head>
<body>
<header>
  <h1>GLOBAL DEAL HUNTER <small>全球羊毛情报中心 · 自动采集</small></h1>
  <div class="meta" id="meta">loading…</div>
</header>
<div class="stats" id="stats"></div>
<nav id="nav">
  <button data-cat="all" class="on">全部</button>
  <button data-cat="today">今日最新</button>
  <button data-cat="hot">高价值榜</button>
  <button data-cat="deadline">即将截止</button>
  <button data-cat="ai">AI 工具</button>
  <button data-cat="crypto">Crypto</button>
  <button data-cat="card">U 卡 / 银行卡</button>
  <button data-cat="bank">海外银行</button>
  <button data-cat="cloud">VPS / 云</button>
  <button data-cat="software">软件</button>
  <button data-cat="expired">已结束</button>
  <span class="sp"></span>
  <input type="search" id="q" placeholder="搜索标题 / 来源…">
</nav>
<main><table id="tbl">
  <thead><tr>
    <th>优惠</th><th>类型</th><th class="hide-sm">价值</th><th>截止</th>
    <th class="hide-sm">地区</th><th class="hide-sm">风险</th><th>核对</th><th class="score">分</th>
  </tr></thead>
  <tbody id="body"></tbody>
</table><div class="empty" id="empty" style="display:none">没有匹配的条目</div></main>
<footer>
  数据全部来自公开 RSS / 官方公告，每条都保留原始链接；未核实的一律不标「已验证」。
  配置见仓库 README。<span id="gen"></span>
</footer>
<script src="data.js"></script>
<script>
const D = window.__DATA__ || {deals:[],stats:{},cats:[]};
const body = document.getElementById('body');
const tbl  = document.getElementById('tbl');
const empty= document.getElementById('empty');
let cat = 'all', q = '';

function daysTo(s){
  if(!s) return null;
  const d = new Date(s + 'T23:59:59Z') - new Date();
  return Math.floor(d / 86400000);
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const today = D.today;
  let list = D.deals.filter(d => {
    if(q){ const t=(d.title+' '+d.source_name).toLowerCase(); if(!t.includes(q)) return false; }
    if(cat === 'all')     return d.status !== 'expired';
    if(cat === 'today')   return d.is_today && d.status !== 'expired';
    if(cat === 'hot')     return d.status !== 'expired' && d.score >= 40;
    if(cat === 'deadline'){
      const n = daysTo(d.ends_at);
      return d.status !== 'expired' && n !== null && n >= 0 && n <= 7;
    }
    if(cat === 'expired') return d.status === 'expired';
    return d.category === cat && d.status !== 'expired';
  });
  if(cat === 'hot') list = list.slice(0, 60);

  body.innerHTML = list.map(d => {
    const n = daysTo(d.ends_at);
    const dl = d.ends_at
      ? '<span class="dl' + (n!==null && n<=3 && n>=0 ? ' soon':'') + '">' + d.ends_at + (n!==null && n>=0 ? ' <small>('+n+'d)</small>' : '') + '</span>'
      : '<span style="color:#484f58">—</span>';
    const kind = d.verify_kind || '';
    const ver = kind === 'ok'
      ? '<span class="verified" title="HTTP 200 · ' + esc(d.last_verified_s) + '">✓ 通</span>'
      : kind === 'blocked'
        ? '<span class="blk" title="站点拒绝自动访问（' + d.verify_status + '），不等于活动失效 · ' + esc(d.last_verified_s) + '">盾 ' + d.verify_status + '</span>'
        : kind === 'dead'
          ? '<span class="unverified" title="HTTP ' + d.verify_status + ' · ' + esc(d.last_verified_s) + '">✗ 死链</span>'
          : kind
            ? '<span class="unverified" title="HTTP ' + d.verify_status + '">!' + d.verify_status + '</span>'
            : '<span style="color:#484f58">未核</span>';
    return '<tr>'
      + '<td class="title"><a href="' + esc(d.official_url) + '" target="_blank" rel="noopener">'
      + esc(d.title) + '</a><div class="src">' + esc(d.source_name) + '</div>'
      + (d.requirements ? '<div class="req" title="领取条件（来自原文关键词，未逐条人工核对）">条件：' + esc(d.requirements) + '</div>' : '')
      + '</td>'
      + '<td><span class="tag t-' + d.price_type + '">' + d.price_label + '</span></td>'
      + '<td class="hide-sm"><span class="val">' + (d.value ? esc(d.value) : '<span style="color:#484f58">—</span>') + '</span></td>'
      + '<td>' + dl + '</td>'
      + '<td class="hide-sm src">' + (d.region ? esc(d.region) : '<span style="color:#484f58">—</span>') + '</td>'
      + '<td class="hide-sm risk">' + (d.risk ? esc(d.risk) : '') + '</td>'
      + '<td>' + ver + '</td>'
      + '<td class="score">' + d.score + '</td>'
      + '</tr>';
  }).join('');

  tbl.style.display = list.length ? '' : 'none';
  empty.style.display = list.length ? 'none' : '';
}

function paintStats(){
  const s = D.stats || {};
  document.getElementById('stats').innerHTML = [
    ['有效条目', s.active], ['今日新增', (D.deals||[]).filter(d=>d.is_today).length],
    ['今日截止 7 天内', (D.deals||[]).filter(d=>{const n=daysTo(d.ends_at);return n!==null&&n>=0&&n<=7;}).length],
    ['已验证链接', s.verified], ['数据源', s.sources], ['已归档', s.expired]
  ].map(([k,v]) => '<div class="stat"><b>' + (v||0) + '</b><span>' + k + '</span></div>').join('');
  document.getElementById('meta').textContent =
    '生成于 ' + (s.generated||'') + ' · 本轮抓取 ' + (s.last_run_fetched||0) + ' 条原始条目 · 共 ' + (s.total||0) + ' 条入库';
  document.getElementById('gen').textContent = ' 最后导出：' + (s.generated||'');
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); cat = b.dataset.cat; render();
});
document.getElementById('q').addEventListener('input', e => {
  q = e.target.value.trim().toLowerCase(); render();
});
paintStats(); render();
</script>
</body>
</html>
